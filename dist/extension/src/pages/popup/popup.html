<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetRepo</title>
    <link rel="stylesheet" href="../../shared/common.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="popup-header">
      <a class="brand" href="#" id="dashboard-link"><span id="logo"></span>LeetRepo</a>
      <div class="row">
        <button class="icon-button" id="open-dashboard" title="Open dashboard" aria-label="Open dashboard">↗</button>
        <button class="icon-button" id="open-settings" title="Settings" aria-label="Settings">☷</button>
      </div>
    </header>
    <main class="popup-main">
      <section class="problem-card card" id="problem-card">
        <div class="row spread"><span class="eyebrow">On this tab</span><span class="badge unknown" id="status-badge">Waiting</span></div>
        <div>
          <h1 id="problem-title">Open a LeetCode problem</h1>
          <div class="problem-meta" id="problem-meta">Your accepted solution will appear here.</div>
        </div>
        <label class="popup-notes" id="popup-notes-wrap"><span>Personal notes</span><textarea id="personal-notes" rows="2" maxlength="4000" placeholder="What should future-you remember?"></textarea></label>
        <button class="button full" id="push-button" disabled>Push to GitHub</button>
      </section>
      <div class="row spread auto-row">
        <div><strong>Auto-push on Accepted</strong><small>Sync as soon as LeetCode accepts</small></div>
        <label class="switch"><input id="auto-push" type="checkbox"><span></span></label>
      </div>
      <div class="row gap-12">
        <div class="stat"><div class="stat-value" id="streak">0</div><div class="stat-label">day streak</div></div>
        <div class="stat"><div class="stat-value" id="synced-count">0</div><div class="stat-label">problems synced</div></div>
      </div>
      <section>
        <div class="eyebrow recent-label">Recent pushes</div>
        <div class="recent-list" id="recent-list"></div>
      </section>
      <div class="notice" id="notice" hidden></div>
      <button class="button secondary full" id="dashboard-button">Open dashboard →</button>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
