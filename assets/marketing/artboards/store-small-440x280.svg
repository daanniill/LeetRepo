<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">LeetRepo small promotional tile</title>
  <desc id="desc">LeetRepo logo and the message Solve it. Keep it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d2423"/><stop offset="1" stop-color="#211c18"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="white" stop-opacity="0"/><stop offset="1" stop-color="white" stop-opacity=".9"/></linearGradient>
    <mask id="art"><rect width="440" height="280" fill="url(#fade)"/></mask>
  </defs>
  <rect width="440" height="280" rx="0" fill="url(#bg)"/>
  <image href="../source/workflow-hero-art.png" x="170" y="0" width="420" height="280" preserveAspectRatio="xMidYMid slice" mask="url(#art)" opacity=".92"/>
  <g transform="translate(28 25)">
    <rect width="38" height="38" rx="12" fill="#2f8f8a"/>
    <g fill="none" stroke="#edeee4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(7 6)"><path d="M5 1v14"/><circle cx="5" cy="21" r="4"/><circle cx="19" cy="5" r="4"/><path d="M19 9c0 7-5 12-12 12"/></g>
    <text x="51" y="27" fill="#f2e9db" font-family="Arial Rounded MT Bold, Trebuchet MS, system-ui, sans-serif" font-size="21" font-weight="700">LeetRepo</text>
  </g>
  <g transform="translate(28 121)">
    <text fill="#f2e9db" font-family="Arial Rounded MT Bold, Trebuchet MS, system-ui, sans-serif" font-size="38" font-weight="700" letter-spacing="-2">Solve it.</text>
    <text y="40" fill="#f2e9db" font-family="Arial Rounded MT Bold, Trebuchet MS, system-ui, sans-serif" font-size="38" font-weight="700" letter-spacing="-2">Keep it.</text>
    <text y="78" fill="#8be4dc" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Accepted → GitHub → review</text>
  </g>
</svg>
