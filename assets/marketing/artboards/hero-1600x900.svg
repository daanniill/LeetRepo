<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">LeetRepo — Solve it. Keep it.</title>
  <desc id="desc">A dark launch graphic showing LeetRepo turning an accepted coding solution into an organized repository and review system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211c18"/>
      <stop offset="1" stop-color="#121816"/>
    </linearGradient>
    <linearGradient id="art-fade" gradientUnits="userSpaceOnUse" x1="500" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".55" stop-color="white" stop-opacity=".58"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="art-mask"><rect width="1600" height="900" fill="url(#art-fade)"/></mask>
    <clipPath id="dash-clip"><rect x="875" y="515" width="650" height="366" rx="24"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1190" cy="385" r="420" fill="#2f8f8a" opacity=".08"/>
  <image href="../source/workflow-hero-art.png" x="500" y="0" width="1100" height="900" preserveAspectRatio="xMidYMid slice" mask="url(#art-mask)"/>

  <g transform="translate(88 72)">
    <rect width="42" height="42" rx="13" fill="#2f8f8a"/>
    <g fill="none" stroke="#edeee4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(9 8)">
      <path d="M5 1v14"/>
      <circle cx="5" cy="21" r="4"/>
      <circle cx="19" cy="5" r="4"/>
      <path d="M19 9c0 7-5 12-12 12"/>
    </g>
    <text x="57" y="29" fill="#edeee4" font-family="Arial Rounded MT Bold, Trebuchet MS, system-ui, sans-serif" font-size="24" font-weight="700">LeetRepo</text>
  </g>

  <g transform="translate(88 226)">
    <text fill="#e08a4e" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="800" letter-spacing="3">LEETCODE, MEET LONG-TERM MEMORY</text>
    <text y="92" fill="#f2e9db" font-family="Arial Rounded MT Bold, Trebuchet MS, system-ui, sans-serif" font-size="82" font-weight="700" letter-spacing="-4">Solve it.</text>
    <text y="174" fill="#f2e9db" font-family="Arial Rounded MT Bold, Trebuchet MS, system-ui, sans-serif" font-size="82" font-weight="700" letter-spacing="-4">Keep it.</text>
    <text y="230" fill="#b8aea1" font-family="Inter, system-ui, sans-serif" font-size="22">Commit every Accepted solution to GitHub—</text>
    <text y="262" fill="#b8aea1" font-family="Inter, system-ui, sans-serif" font-size="22">organized, documented, and ready to review.</text>
    <g transform="translate(0 310)">
      <rect width="290" height="58" rx="29" fill="#e08a4e"/>
      <text x="145" y="37" text-anchor="middle" fill="#211c18" font-family="Arial Rounded MT Bold, Trebuchet MS, system-ui, sans-serif" font-size="17" font-weight="700">Turn Accepted into progress →</text>
    </g>
    <g transform="translate(0 410)" fill="#8f978e" font-family="Inter, system-ui, sans-serif" font-size="14">
      <text>Automatic GitHub commits</text>
      <circle cx="196" cy="-5" r="3" fill="#2f8f8a"/>
      <text x="213">Clean READMEs</text>
      <circle cx="340" cy="-5" r="3" fill="#2f8f8a"/>
      <text x="357">Spaced review</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="859" y="499" width="682" height="398" rx="32" fill="#2b2622" stroke="#f2e9db" stroke-opacity=".16" stroke-width="2"/>
    <circle cx="891" cy="521" r="5" fill="#e08a4e"/>
    <circle cx="909" cy="521" r="5" fill="#2f8f8a"/>
    <circle cx="927" cy="521" r="5" fill="#4e5a37"/>
    <image href="../source/dashboard-problems-dark.png" x="875" y="515" width="650" height="366" preserveAspectRatio="xMidYMid slice" clip-path="url(#dash-clip)"/>
  </g>
</svg>
