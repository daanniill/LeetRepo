<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">LeetRepo Chrome Web Store promotional graphic</title>
  <desc id="desc">A dark product graphic with LeetRepo’s extension popup and dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#211c18"/><stop offset="1" stop-color="#0d2423"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#55c9be" stop-opacity=".25"/><stop offset="1" stop-color="#55c9be" stop-opacity="0"/></radialGradient>
    <clipPath id="dash"><rect x="789" y="176" width="560" height="315" rx="19"/></clipPath>
    <clipPath id="popup"><rect x="634" y="117" width="224" height="429" rx="22"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1400" height="560" fill="url(#bg)"/>
  <ellipse cx="1000" cy="310" rx="520" ry="420" fill="url(#glow)"/>
  <path d="M562 445c66-46 79-138 168-138 64 0 73 80 138 80 77 0 101-114 189-114" fill="none" stroke="#55c9be" stroke-opacity=".28" stroke-width="5"/>

  <g transform="translate(66 54)">
    <rect width="44" height="44" rx="14" fill="#2f8f8a"/>
    <g fill="none" stroke="#edeee4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(9 8)"><path d="M5 1v14"/><circle cx="5" cy="21" r="4"/><circle cx="19" cy="5" r="4"/><path d="M19 9c0 7-5 12-12 12"/></g>
    <text x="59" y="30" fill="#f2e9db" font-family="Arial Rounded MT Bold, Trebuchet MS, system-ui, sans-serif" font-size="26" font-weight="700">LeetRepo</text>
  </g>

  <g transform="translate(66 178)">
    <text fill="#8be4dc" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="2.5">FROM ACCEPTED TO INTERVIEW-READY</text>
    <text y="66" fill="#f2e9db" font-family="Arial Rounded MT Bold, Trebuchet MS, system-ui, sans-serif" font-size="50" font-weight="700" letter-spacing="-2.4">Commit every solve.</text>
    <text y="120" fill="#f2e9db" font-family="Arial Rounded MT Bold, Trebuchet MS, system-ui, sans-serif" font-size="50" font-weight="700" letter-spacing="-2.4">Build a study system.</text>
    <text y="166" fill="#a89b8a" font-family="Inter, system-ui, sans-serif" font-size="18">GitHub sync, clean READMEs, attempt history, and review cues.</text>
    <g transform="translate(0 211)" fill="#f2e9db" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">
      <g><circle cx="7" cy="-5" r="7" fill="#2f8f8a"/><path d="m4-5 2 2 4-5" fill="none" stroke="#edeee4" stroke-width="2"/><text x="23">Auto-push on Accepted</text></g>
      <g transform="translate(0 36)"><circle cx="7" cy="-5" r="7" fill="#2f8f8a"/><path d="m4-5 2 2 4-5" fill="none" stroke="#edeee4" stroke-width="2"/><text x="23">Your code stays yours</text></g>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="772" y="159" width="594" height="349" rx="28" fill="#211c18" stroke="#fff" stroke-opacity=".12"/>
    <image href="../source/dashboard-problems-dark.png" x="789" y="176" width="560" height="315" preserveAspectRatio="xMidYMid slice" clip-path="url(#dash)"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="619" y="102" width="254" height="459" rx="30" fill="#211c18" stroke="#fff" stroke-opacity=".14"/>
    <image href="../source/popup-dark.png" x="634" y="117" width="224" height="429" preserveAspectRatio="xMidYMin slice" clip-path="url(#popup)"/>
  </g>
</svg>
