name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leetrepo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leetrepo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run release:check
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/leetrepo_test
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v7
        with:
          name: chrome-web-store-package
          path: dist/leetrepo-extension-*.zip
          if-no-files-found: error
          retention-days: 14
